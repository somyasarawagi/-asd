name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest tests -q
      - run: pyinstaller --noconfirm --onefile --name OMR-Reader --add-data "omr/static;omr/static" --hidden-import waitress --collect-submodules pymupdf run.py
      - uses: actions/upload-artifact@v4
        with:
          name: OMR-Reader-windows
          path: dist/OMR-Reader.exe
