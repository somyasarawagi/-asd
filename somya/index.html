<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Somya</title>
<style>
body{margin:0;min-height:100vh;background:#050b14;color:#7df9ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;box-sizing:border-box}
#orb{width:150px;height:150px;border-radius:50%;border:3px solid #7df9ff;box-shadow:0 0 40px #7df9ff88,inset 0 0 40px #7df9ff44;cursor:pointer;display:grid;place-items:center;font-size:20px;letter-spacing:3px}
#orb.on{animation:p 1s infinite alternate}@keyframes p{to{box-shadow:0 0 80px #7df9ff,inset 0 0 60px #7df9ff88}}
#log{width:min(560px,100%);height:220px;overflow:auto;border:1px solid #7df9ff55;border-radius:10px;padding:10px;box-sizing:border-box;font-size:15px}
input{width:min(560px,100%);box-sizing:border-box;padding:10px;background:#0a1626;color:#7df9ff;border:1px solid #7df9ff55;border-radius:8px;font-size:16px}
small{opacity:.7}
</style></head><body>
<h1 style="margin:0;letter-spacing:6px">SOMYA</h1>
<div id="orb">TAP</div>
<div id="log"></div>
<input id="t" placeholder="ya yahan type karo aur Enter dabao (open youtube, play song, time, joke...)">
<small>Mic ke liye Chrome use karo. Bolo: "open youtube", "play arijit singh", "search cricket score", "time", "joke"</small>
<script>
const log=document.getElementById('log'),orb=document.getElementById('orb');
const add=(w,m)=>{log.innerHTML+=`<div><b>${w}:</b> ${m}</div>`;log.scrollTop=log.scrollHeight};
function say(m){add('Somya',m);try{const u=new SpeechSynthesisUtterance(m);speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const SITES={youtube:'https://youtube.com',google:'https://google.com',gmail:'https://mail.google.com',github:'https://github.com',whatsapp:'https://web.whatsapp.com',instagram:'https://instagram.com'};
const go=u=>window.open(u,'_blank');
function handle(c){
 c=c.toLowerCase().replace(/\b(somya|jarvis|hey)\b/g,'').trim();
 if(!c)return say("Haan, bolo!");
 if(/\b(bye|stop|exit)\b/.test(c))return say("Bye! Jab chahiye bula lena.");
 if(/^(hello|hi|hey)/.test(c))return say("Hello! Main Somya hoon, aapki assistant.");
 if(/who are you|your name/.test(c))return say("Main Somya hoon, aapki personal Jarvis.");
 if(c.includes('time'))return say(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
 if(c.includes('date')||c.includes('today'))return say(new Date().toDateString());
 if(c.includes('joke'))return say("Programmers dark mode kyun use karte hain? Kyunki light se bugs aate hain!");
 if(c.startsWith('play ')){say("YouTube par chala rahi hoon: "+c.slice(5));return go('https://www.youtube.com/results?search_query='+encodeURIComponent(c.slice(5)))}
 let m=c.match(/^(?:search|google)(?: for)? (.+)/);
 if(m){say("Search kar rahi hoon: "+m[1]);return go('https://www.google.com/search?q='+encodeURIComponent(m[1]))}
 m=c.match(/^open (.+)/);
 if(m){const k=m[1].trim();if(SITES[k]){say("Opening "+k);return go(SITES[k])}
  say("Opening "+k);return go('https://www.google.com/search?q='+encodeURIComponent(k))}
 say("Samajh nahi aaya. Try: open youtube, play song, search something, time.");
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,on=false;
orb.onclick=()=>{
 if(!SR)return say("Is browser mein mic nahi chalta, Chrome use karo ya neeche type karo.");
 if(on){on=false;rec.stop();orb.classList.remove('on');orb.textContent='TAP';return}
 rec=new SR();rec.lang='en-IN';rec.continuous=true;
 rec.onresult=e=>{const r=e.results[e.results.length-1][0].transcript;add('You',r);handle(r)};
 rec.onend=()=>{if(on)rec.start()};rec.start();on=true;orb.classList.add('on');orb.textContent='LISTENING';
};
document.getElementById('t').onkeydown=e=>{if(e.key==='Enter'&&e.target.value){add('You',e.target.value);handle(e.target.value);e.target.value=''}};
say("Hello, main Somya hoon. Orb dabao aur bolo.");
</script></body></html>
